name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build release archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist/darwin-arm64 dist/darwin-amd64
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.version=$VERSION" \
            -o dist/darwin-arm64/mail-mcp ./cmd/mail-mcp
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.version=$VERSION" \
            -o dist/darwin-amd64/mail-mcp ./cmd/mail-mcp
          tar -C dist/darwin-arm64 -czf dist/mail-mcp-darwin-arm64.tar.gz mail-mcp
          tar -C dist/darwin-amd64 -czf dist/mail-mcp-darwin-amd64.tar.gz mail-mcp
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --generate-notes
